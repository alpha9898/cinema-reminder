name: Check cinemas

on:
  schedule:
    - cron: "7 * * * *"  # كل ساعة (الدقيقة 7 عشان GitHub بيبقى زحمة على الدقيقة 0)
  workflow_dispatch:     # زرار Run workflow عشان تشغله بإيدك

permissions:
  contents: write  # عشان يحفظ data/state.json

concurrency:
  group: cinema-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: Secrets missing
        if: env.TELEGRAM_BOT_TOKEN == '' || env.TELEGRAM_CHAT_ID == ''
        run: echo "::notice::ضيف TELEGRAM_BOT_TOKEN و TELEGRAM_CHAT_ID في Settings > Secrets and variables > Actions عشان البوت يشتغل"

      - name: Check cinemas
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: python -m cinema_bot.main

      - name: Save state
        if: always()
        run: |
          if [ -n "$(git status --porcelain -- data/state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/state.json
            git commit -m "Update cinema state"
            git pull --rebase
            git push
          fi
